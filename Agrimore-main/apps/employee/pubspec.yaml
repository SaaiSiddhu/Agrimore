name: employee
description: "Agrimore Employee App - B2B sales dashboard, commission wallet, and payouts"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Shared Packages
  agrimore_core:
    path: ../../packages/agrimore_core
  agrimore_ui:
    path: ../../packages/agrimore_ui
  agrimore_services:
    path: ../../packages/agrimore_services

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  cloud_functions: ^5.6.2
  firebase_messaging: ^15.1.6
  firebase_app_check: ^0.3.1

  # State Management
  provider: ^6.1.2

  # Utilities
  shared_preferences: ^2.3.4
  intl: ^0.20.2

  # UI
  cupertino_icons: ^1.0.8

  # Phase 16B: share sheet for the associate's own code (dashboard_screen).
  # Pinned to the SAME constraint apps/marketplace already ships
  # (apps/marketplace/pubspec.yaml), so this adds no new version to resolve
  # anywhere in the workspace. Deliberately app-local — never added to
  # agrimore_core/agrimore_services/agrimore_ui, which would push it onto
  # the four apps that have no use for it.
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
