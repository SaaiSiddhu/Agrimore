name: seller
description: "Agrimore Seller App - Manage products, inventory, and orders"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Shared Packages
  agrimore_core:
    path: ../../packages/agrimore_core
  agrimore_ui:
    path: ../../packages/agrimore_ui
  agrimore_services:
    path: ../../packages/agrimore_services
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  cloud_functions: ^5.6.2
  firebase_messaging: ^15.1.6
  firebase_app_check: ^0.3.1

  # State Management
  provider: ^6.1.2
  
  # Location
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.0
  geocoding: ^3.0.0
  
  # Utilities
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  firebase_storage: ^12.3.7
  
  # UI — the seller's own design system (lib/design_system/) uses Lucide icons
  # (same constraint as the shared packages, so the lockfile resolves the same version).
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/seller_logo.png"

flutter:
  uses-material-design: true
  # SELLER-AUTH-1a: all user-visible copy lives in lib/l10n/*.arb (ADR-S16).
  generate: true

  # Phase 19: `.env` is deliberately NOT an asset here. Flutter copies assets
  # verbatim into the APK/AAB, and the project `.env` carries server-only
  # credentials — they shipped inside the published 1.0.7 build because of this
  # one line. Nothing in the Dart code reads it (EnvConfig was deleted in the
  # same phase). Do not re-add it.
  assets:
    - assets/images/

  # SELLER-REDESIGN-1 (decisions D0/D14b): Inter 4.1 (SIL OFL 1.1, assets/fonts/OFL.txt)
  # bundled with the seller app itself — the seller's own design system.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
