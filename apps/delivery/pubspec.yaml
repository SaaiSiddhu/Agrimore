name: delivery
description: "Agrimore Delivery Partner App - Real-time order delivery management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  # DLV-C1: rider copy comes from lib/l10n/*.arb (generated AppLocalizations).
  flutter_localizations:
    sdk: flutter
  
  # Shared Packages
  agrimore_core:
    path: ../../packages/agrimore_core
  agrimore_ui:
    path: ../../packages/agrimore_ui
  agrimore_services:
    path: ../../packages/agrimore_services
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  # Phase FIX-5 (finding N-5): apps/delivery now calls the confirmDelivery
  # callable instead of comparing the verification code locally. It arrived
  # transitively through agrimore_services (^5.1.3), but importing it in app
  # code without declaring it here trips depend_on_referenced_packages.
  # Pinned to ^5.6.2 to match apps/marketplace, apps/admin and apps/employee.
  cloud_functions: ^5.6.2
  firebase_messaging: ^15.1.6
  # Phase DLV-2B: the ringing full-screen delivery-offer alert. Already in the
  # build through agrimore_services (same constraint); declared because the
  # app now imports it directly (depend_on_referenced_packages).
  flutter_local_notifications: ^18.0.1
  firebase_app_check: ^0.3.1

  # State Management
  provider: ^6.1.2
  
  # Location
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.0
  geocoding: ^3.0.0
  
  # Utilities
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  firebase_storage: ^12.3.7
  
  # UI — the delivery partner's own design system (lib/design_system/) uses Lucide icons
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  # Transitive via image_picker; used directly only in tests to fake an
  # XFile.fromData without a real platform channel (DLVSUP1).
  cross_file: ^0.3.5

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/delivery_logo.png"

flutter:
  uses-material-design: true
  generate: true

  # Phase 19: `.env` is deliberately NOT an asset here. Flutter copies assets
  # verbatim into the APK/AAB, and the project `.env` carries server-only
  # credentials — they shipped inside the published 1.0.7 build because of this
  # one line. Nothing in the Dart code reads it (EnvConfig was deleted in the
  # same phase). Do not re-add it.
  assets:
    - assets/images/

  # DELIVERY-REDESIGN-1 (decision D-SELLER-OWN-DS): Inter 4.1 (SIL OFL 1.1, assets/fonts/OFL.txt)
  # bundled with the delivery app itself — the delivery partner's own design system.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

