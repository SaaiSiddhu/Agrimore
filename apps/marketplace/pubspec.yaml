name: agrimore_marketplace
description: Agrimore Marketplace - Customer-facing agricultural e-commerce application
# versionCode follows the existing date-based scheme already used on Play:
# YYYYMMDD + a 2-digit build counter for that day. The previously published
# release was 2026082701 (1.0.7), so this must stay strictly above it.
# Play's hard ceiling for versionCode is 2100000000, which this scheme stays
# under until the year 2100.
version: 1.0.8+2026090102
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_web_plugins:
    sdk: flutter

  # Internal packages
  agrimore_core:
    path: ../../packages/agrimore_core
  agrimore_services:
    path: ../../packages/agrimore_services
  agrimore_ui:
    path: ../../packages/agrimore_ui

  # State Management
  provider: ^6.1.2
  flutter_hooks: ^0.20.5

  # Firebase (already in services, but needed for options)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1
  # Phase M2: pinned to the 4.x line (not the latest 5.x) because 5.x requires
  # firebase_core ^4.14.0, a breaking major bump this app hasn't made. 4.3.10 is
  # the newest release still compatible with the firebase_core 3.15.2 already
  # resolved here.
  firebase_crashlytics: ^4.3.10

  # Authentication
  google_sign_in: ^6.2.1

  # Permissions
  permission_handler: ^11.3.1

  # Payment Gateway
  razorpay_flutter: ^1.3.7
  android_intent_plus: ^5.0.2
  url_launcher: ^6.3.1
  http: ^1.2.0
  cloud_functions: ^5.6.2
  shared_preferences: ^2.3.3
  web: ^1.1.0

  # Maps & Location
  google_maps_flutter: ^2.9.0
  google_maps_flutter_web: ^0.5.10
  google_maps_flutter_platform_interface: ^2.9.0

  # Image Handling
  image_picker: ^1.1.2
  image_picker_web: ^4.0.0
  # Used directly by several screens (categories_screen.dart and its new
  # widgets/, product/category cards elsewhere) but was only resolving
  # transitively until now — same fix as the geolocator/geocoding move above.
  cached_network_image: ^3.4.1

  # Sharing
  share_plus: ^10.1.2

  # Date/Time
  timeago: ^3.7.0

  # UI Components
  confetti: ^0.7.0
  flutter_markdown: ^0.7.1
  timeline_tile: ^2.0.0

  # Audio Recording
  record: ^6.0.0
  audioplayers: ^6.0.0
  path_provider: ^2.1.2
  package_info_plus: ^8.1.2

  # Location — imported directly by address_bottom_sheet.dart, mobile_home_screen.dart
  # and home_app_bar.dart, but was previously only resolving transitively (declared
  # by accident under the flutter_launcher_icons: block below instead of here). Moved
  # so it's a real, direct dependency rather than depending on some other package
  # continuing to pull it in.
  geolocator: ^13.0.2
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  # Phase 19: `.env` is deliberately NOT an asset here. Flutter copies assets
  # verbatim into the APK/AAB, and the project `.env` carries server-only
  # credentials — they shipped inside the published 1.0.7 build because of this
  # one line. Nothing in the Dart code reads it (EnvConfig was deleted in the
  # same phase). Do not re-add it.
  assets:
    - assets/images/
    - assets/images/Profile/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/NotoSans-Regular.ttf
    - assets/map_styles/dark_map.json
    - assets/map_styles/light_map.json

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400

# Regenerate with: dart run flutter_launcher_icons
# customer_logo.png is the mark-only brand icon (no text) — matches what the
# reference Agrimore build ships as App_Icon.png. The previous source here was
# the full text logo (also used for the in-app splash/hero image), which
# Android's adaptive-icon masking crops hard: most of the mark and all of the
# "AgriMore" wordmark got cut away, leaving only a bare wheat+cart glyph on
# launcher screens. #000000 matches the mark's own baked-in background so
# there's no visible seam between the foreground artwork and the background.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/customer_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/customer_logo.png"
  remove_alpha_ios: true

# Regenerate with: dart run flutter_native_splash:create
# Previously unconfigured — android/app/src/main/res/drawable/launch_background.xml
# was a hand-edited placeholder showing the (broken, cropped) launcher icon on a
# flat colorPrimary green. splash_icon.png is the full logo+text mark on a
# transparent background, so the black splash color shows through everywhere
# except the artwork itself — matching the reference build's Splash_Icon.png.
flutter_native_splash:
  color: "#000000"
  image: "assets/icons/splash_icon.png"
  android: true
  ios: true
